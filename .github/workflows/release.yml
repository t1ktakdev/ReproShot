name: Publish npm release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package.json version to publish from the matching v<version> tag'
        required: true
        type: string
      confirm:
        description: 'Type publish-reproshot to intentionally publish'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: inputs.confirm == 'publish-reproshot' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release version and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          if (version !== process.env.RELEASE_VERSION || process.env.GITHUB_REF !== "refs/tags/v" + version) throw new Error("Version and tag must match");'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm publish --access public
