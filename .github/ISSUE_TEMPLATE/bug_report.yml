name: Bug report
description: Report a problem with ReproShot.
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: 'Review captured files before attaching them. Do not post credentials or private source code. Report sanitizer leaks privately using SECURITY.md.'
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal command, setup and observed behavior. You can paste a reviewed reproshot issue body.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: ReproShot version, Node version, OS and shell
    validations:
      required: true
